<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - ChokePidgin.com</title>
    <meta name="description" content="Sign in or create an account on ChokePidgin to bookmark favorite words, sync across devices, and track your Pidgin learning progress.">
    <link rel="canonical" href="https://chokepidgin.com/login.html">
    
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="css/tailwind.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>
        .brand-font { font-family: 'Pacifico', cursive; }
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col text-slate-100">
    <!-- NAVIGATION_PLACEHOLDER -->

    <main class="flex-grow max-w-md mx-auto px-4 py-12 w-full flex flex-col justify-center">
        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
            <!-- Header Banner -->
            <div class="hero-gradient p-6 text-center">
                <div class="text-3xl mb-1">🤙</div>
                <h1 class="text-2xl font-black text-white">Aloha & Welcome!</h1>
                <p class="text-blue-100 text-xs mt-1">Sign in to save favorite words & track your Pidgin progress.</p>
            </div>

            <!-- Tab Headers -->
            <div class="flex border-b border-slate-700 bg-slate-850">
                <button id="tab-login" class="flex-1 py-4 text-center font-bold text-blue-400 border-b-2 border-blue-500 transition">Sign In</button>
                <button id="tab-register" class="flex-1 py-4 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">Create Account</button>
            </div>

            <div class="p-6 md:p-8 space-y-6">
                <!-- Google Sign-In Button -->
                <div>
                    <button type="button" id="google-auth-btn" class="w-full bg-white hover:bg-slate-100 text-slate-800 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 transition shadow-md hover:shadow-lg border border-slate-200 active:scale-[0.99]">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink mx-4 text-xs uppercase font-bold text-slate-500 tracking-wider">Or with email</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Email Address</label>
                        <input type="email" id="login-email" required placeholder="your.name@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:border-blue-400 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:border-blue-400 focus:outline-none transition">
                    </div>
                    <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-blue-500/20 active:scale-[0.99]">
                        Sign In
                    </button>
                </form>

                <!-- Register Form (Hidden by default) -->
                <form id="register-form" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Display Name</label>
                        <input type="text" id="reg-name" required placeholder="Local Legend" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:border-blue-400 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Email Address</label>
                        <input type="email" id="reg-email" required placeholder="your.name@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:border-blue-400 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Password</label>
                        <input type="password" id="reg-password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:border-blue-400 focus:outline-none transition">
                    </div>
                    <button type="submit" id="register-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-emerald-500/20 active:scale-[0.99]">
                        Create Free Account
                    </button>
                </form>

                <!-- Error & Status Notification -->
                <div id="auth-error" class="hidden p-3 bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-xl text-center font-medium"></div>
                <div id="auth-success" class="hidden p-3 bg-emerald-900/40 border border-emerald-500/50 text-emerald-300 text-sm rounded-xl text-center font-medium"></div>
            </div>
        </div>

        <p class="text-center text-slate-500 text-xs mt-6">
            🔒 By signing in, you can sync your bookmarked Pidgin terms and earn island badges across all your devices.
        </p>
    </main>

    <!-- FOOTER_PLACEHOLDER -->

    <!-- Components & Auth Scripts -->
    <script src="js/components/user-auth.js"></script>
    <script src="js/components/favorites-manager.js"></script>
    <script src="js/main.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const authError = document.getElementById('auth-error');
            const authSuccess = document.getElementById('auth-success');
            const googleBtn = document.getElementById('google-auth-btn');

            // If already logged in, redirect to collection
            if (window.UserAuth && window.UserAuth.isLoggedIn()) {
                window.location.href = '/my-collection.html';
                return;
            }

            const showError = (msg) => {
                authError.textContent = msg;
                authError.classList.remove('hidden');
                authSuccess.classList.add('hidden');
            };

            const showSuccess = (msg) => {
                authSuccess.textContent = msg;
                authSuccess.classList.remove('hidden');
                authError.classList.add('hidden');
            };

            const switchTab = (isLogin) => {
                if (isLogin) {
                    loginTab.classList.add('text-blue-400', 'border-blue-500');
                    loginTab.classList.remove('text-slate-400', 'border-transparent');
                    regTab.classList.add('text-slate-400', 'border-transparent');
                    regTab.classList.remove('text-blue-400', 'border-blue-500');
                    loginForm.classList.remove('hidden');
                    regForm.classList.add('hidden');
                } else {
                    regTab.classList.add('text-blue-400', 'border-blue-500');
                    regTab.classList.remove('text-slate-400', 'border-transparent');
                    loginTab.classList.add('text-slate-400', 'border-transparent');
                    loginTab.classList.remove('text-blue-400', 'border-blue-500');
                    regForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                }
                authError.classList.add('hidden');
                authSuccess.classList.add('hidden');
            };

            loginTab.addEventListener('click', () => switchTab(true));
            regTab.addEventListener('click', () => switchTab(false));

            // Handle Email/Password Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('login-btn');
                btn.disabled = true;
                btn.textContent = 'Signing in...';
                authError.classList.add('hidden');

                try {
                    const email = document.getElementById('login-email').value;
                    const password = document.getElementById('login-password').value;

                    await window.UserAuth.login(email, password);
                    showSuccess('Aloha! Signed in successfully. Redirecting...');
                    
                    if (window.favoritesManager) await window.favoritesManager.syncFromCloud();
                    setTimeout(() => {
                        window.location.href = '/my-collection.html';
                    }, 500);
                } catch (err) {
                    showError(err.message || 'Invalid email or password');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            });

            // Handle Registration
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('register-btn');
                btn.disabled = true;
                btn.textContent = 'Creating account...';
                authError.classList.add('hidden');

                try {
                    const email = document.getElementById('reg-email').value;
                    const password = document.getElementById('reg-password').value;
                    const name = document.getElementById('reg-name').value;

                    await window.UserAuth.register(email, password, name);
                    showSuccess('Mahalo! Account created. Welcome to da ohana!');
                    
                    setTimeout(() => {
                        window.location.href = '/my-collection.html';
                    }, 600);
                } catch (err) {
                    showError(err.message || 'Registration failed. Try a different email.');
                    btn.disabled = false;
                    btn.textContent = 'Create Free Account';
                }
            });

            // Handle Google Sign-In
            googleBtn.addEventListener('click', async () => {
                const promptName = prompt('Enter your name or email for Google Sign-In demo:', 'Aloha Explorer');
                if (!promptName) return;

                const googleEmail = promptName.includes('@') ? promptName : `${promptName.toLowerCase().replace(/[^a-z0-9]/g, '')}@gmail.com`;

                try {
                    await window.UserAuth.loginWithGoogle({
                        email: googleEmail,
                        name: promptName,
                        google_id: `g_${Date.now()}`
                    });
                    showSuccess('Signed in with Google! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/my-collection.html';
                    }, 500);
                } catch (err) {
                    showError(err.message || 'Google authentication failed');
                }
            });
        });
    </script>
</body>
</html>
