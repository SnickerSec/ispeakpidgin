<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ChokePidgin.com</title>
    <meta name="description" content="Sign in or create an account on ChokePidgin to bookmark favorite words, sync across devices, and track your Pidgin learning progress.">
    <link rel="canonical" href="https://chokepidgin.com/login.html">
    
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="css/tailwind.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>
        .brand-font { font-family: 'Pacifico', cursive; }
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col text-slate-100">
    <!-- NAVIGATION_PLACEHOLDER -->

    <main class="flex-grow max-w-md mx-auto px-4 py-12 w-full flex flex-col justify-center">
        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
            <!-- Header Banner -->
            <div class="hero-gradient p-6 text-center">
                <div class="text-3xl mb-1">🤙</div>
                <h1 class="text-2xl font-black text-white">Aloha & Welcome!</h1>
                <p class="text-blue-100 text-xs mt-1">Sign in to save favorite words & track your Pidgin progress.</p>
            </div>

            <div class="p-6 md:p-8 space-y-6">
                <!-- Google Sign-In button is rendered here by Google Identity Services -->
                <div id="google-signin" class="flex justify-center min-h-[44px]"></div>
                <p class="text-center text-slate-400 text-xs">New here? Signing in with Google creates your free account.</p>
                <!-- Error & Status Notification -->
                <div id="auth-error" class="hidden p-3 bg-red-900/40 border border-red-500/50 text-red-300 text-sm rounded-xl text-center font-medium"></div>
                <div id="auth-success" class="hidden p-3 bg-emerald-900/40 border border-emerald-500/50 text-emerald-300 text-sm rounded-xl text-center font-medium"></div>
            </div>
        </div>

        <p class="text-center text-slate-500 text-xs mt-6">
            🔒 By signing in, you can sync your bookmarked Pidgin terms and earn island badges across all your devices.
        </p>
    </main>

    <!-- FOOTER_PLACEHOLDER -->

    <!-- Components & Auth Scripts -->
    <script src="js/components/user-auth.js"></script>
    <script src="js/components/favorites-manager.js"></script>
    <script src="js/main.js" defer></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authError = document.getElementById('auth-error');
            const authSuccess = document.getElementById('auth-success');
            const buttonContainer = document.getElementById('google-signin');

            // If already logged in, redirect to collection
            if (window.UserAuth && window.UserAuth.isLoggedIn()) {
                window.location.href = '/my-collection.html';
                return;
            }

            const showError = (msg) => {
                authError.textContent = msg;
                authError.classList.remove('hidden');
                authSuccess.classList.add('hidden');
            };

            const showSuccess = (msg) => {
                authSuccess.textContent = msg;
                authSuccess.classList.remove('hidden');
                authError.classList.add('hidden');
            };

            const handleCredential = async (response) => {
                authError.classList.add('hidden');
                try {
                    const data = await window.UserAuth.loginWithGoogle(response.credential);
                    showSuccess(data.isNewUser
                        ? 'Mahalo! Account created. Welcome to da ohana!'
                        : 'Aloha! Signed in successfully. Redirecting...');
                    if (window.favoritesManager) await window.favoritesManager.syncFromCloud();
                    setTimeout(() => {
                        window.location.href = '/my-collection.html';
                    }, 500);
                } catch (err) {
                    showError(err.message || 'Google authentication failed');
                }
            };

            let clientId = null;
            try {
                const res = await fetch('/api/user/auth-config');
                clientId = (await res.json()).googleClientId;
            } catch (e) {
                // handled below
            }
            if (!clientId) {
                showError('Sign-in is temporarily unavailable. Please try again later.');
                return;
            }

            // The GSI script loads async; wait for it before rendering the button
            const waitForGoogle = () => new Promise((resolve, reject) => {
                const started = Date.now();
                (function check() {
                    if (window.google?.accounts?.id) return resolve();
                    if (Date.now() - started > 10000) return reject(new Error('timeout'));
                    setTimeout(check, 100);
                })();
            });

            try {
                await waitForGoogle();
            } catch (e) {
                showError('Could not load Google Sign-In. Check your connection or disable blockers for this site.');
                return;
            }

            google.accounts.id.initialize({
                client_id: clientId,
                callback: handleCredential,
                ux_mode: 'popup'
            });
            google.accounts.id.renderButton(buttonContainer, {
                theme: 'outline',
                size: 'large',
                shape: 'pill',
                text: 'continue_with',
                width: Math.min(buttonContainer.offsetWidth || 320, 400)
            });
        });
    </script>
</body>
</html>
