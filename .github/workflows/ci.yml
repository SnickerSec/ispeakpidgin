# CI: install, syntax/module load check, Railway-equivalent build, and the
# full validation suite on every push to main and every PR.
#
# Everything here runs green without any secrets: config/supabase.js falls back
# to an offline mock client, so the page generators and all seven test suites
# work against fixture data.
#
# Adding a repo secret SUPABASE_ANON_KEY (the public client key already shipped
# to browsers) is optional — it upgrades the same steps to run against live
# Supabase data instead of the mock. SUPABASE_URL has a committed fallback.
#   Settings -> Secrets and variables -> Actions -> New repository secret
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo; nothing here writes to it. Without an explicit block the
# GITHUB_TOKEN carries whatever the repository default grants (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    # When these secrets exist the build and tests run against live Supabase;
    # when they don't, config/supabase.js supplies an offline mock instead.
    # Either way the steps below run — they are never skipped.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load check (syntax + module wiring)
        run: |
          node --check server.js
          node --check build.js
          node -e "[
            './routes/ai','./routes/tts','./routes/dictionary','./routes/content',
            './routes/games','./routes/pickup','./routes/admin','./routes/questions',
            './routes/user','./routes/suggestions',
            './services/gamification-service','./services/settings-manager',
            './middleware/admin-auth'
          ].forEach(m => require(m)); console.log('✅ all server modules load')"

      - name: Runtime dependency check (static)
        # Cheap static gate for the same failure class as the boot check below:
        # every require() in the files the Dockerfile runtime stage ships must
        # resolve to a production dependency or to another shipped file. Runs
        # before the build so a dependency mistake fails in seconds.
        run: npm run test:runtime-deps

      - name: Build (Railway-equivalent)
        run: npm run build

      - name: Boot check against the runtime image (file set + prod-only deps)
        # The load check above runs against a full checkout with devDependencies
        # installed, so on its own it cannot catch either production-only failure:
        # a server-side require() reaching into a directory the Dockerfile runtime
        # stage does not COPY, or one resolving to a devDependency that
        # `npm ci --omit=dev` strips out. Both have shipped and taken the whole
        # site down with MODULE_NOT_FOUND -- the second on 2026-08-26, via
        # google-auth-library in routes/user.js.
        #
        # An earlier version of this step symlinked the full node_modules, which
        # is exactly why it stayed green through that outage. Install prod deps
        # for real instead; it is the only faithful reproduction of the image.
        run: |
          set -euo pipefail
          RT=$(mktemp -d)
          # Mirror the COPY lines in the Dockerfile runtime stage.
          cp server.js package.json package-lock.json .npmrc "$RT"/
          cp -r routes middleware services "$RT"/
          mkdir -p "$RT/src/components"
          cp -r src/components/speech "$RT/src/components/speech"
          cd "$RT"
          npm ci --omit=dev
          node -e "[
            './routes/ai','./routes/tts','./routes/dictionary','./routes/content',
            './routes/games','./routes/pickup','./routes/admin','./routes/questions',
            './routes/user','./routes/suggestions',
            './services/gamification-service','./services/settings-manager',
            './middleware/admin-auth'
          ].forEach(m => require(m)); console.log('✅ server boots with runtime-only files and prod-only deps')"

      - name: Validation suite
        # Runs unconditionally. `npm test` (tools/testing/run-all-tests.js) drives
        # all seven suites — including validate-phase-2-3.js, which is why
        # `npm run test:translator` is not invoked separately here — and exits 1
        # if any of them fail.
        run: npm test
